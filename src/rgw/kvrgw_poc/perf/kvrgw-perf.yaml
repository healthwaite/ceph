# kvrgw-perf configuration: the single file that configures a perf invocation.
#
# Resolution order for every key:  built-in default <- base <- <command> section <- CLI flag.
# Keys are snake_case and identical to the CLI flag names (--page-size <=> page_size).
# Unknown keys, wrong types, and both `ops` and `duration` being set are errors.
# The values below are the soak-test settings (long durations, 1 billion objects); built-in defaults differ.
#
# Located by --config, else ./kvrgw-perf.yaml, else next to the kvrgw-perf binary
# (the build copies this file there), else /opt/kvrgw/kvrgw-perf.yaml (run image).

# ---- kvrgw runtime config (replaces backend/kvrgw.yaml for perf runs) ----------------
# The controller synthesizes <run-dir>/kvrgw.yaml from this section and points every
# worker at it (KVRGW_CONFIG_FILE). The runtime's yaml loader only reads the first three
# keys; the controller also exports batch_* and the async keys as KVRGW_* variables so they
# take effect.
kvrgw:
  max_inline: 256            # objects <= this many bytes are stored inline in the metadata value
  max_kv_store: 4096         # objects <= this are stored as FDB KV entries; larger go to the data store
  kv_store_coalescing: false
  batch_size: 10             # PutObject batch queue: max entries per commit
  batch_timeout_us: 1000     # ... or flush after this long
  # Async backend. backend_workers replaces batch_threads (still accepted, deprecated: it is
  # read as backend_workers when backend_workers is not set).
  backend_workers: 4         # backend worker executors (threads) per worker process
  max_inflight_ops: 4096     # in-flight async ops; beyond it a submit fails fast (queue_full)
  txn_max_attempts: 3        # FDB attempts for ordinary ops (retries back off via on_error)
  batch_txn_max_attempts: 10 # FDB commit attempts for a PUT batch's final transaction
  txn_timeout_ms: 0          # FDB transaction timeout for the async ops (0 = off)
  # Simulated data-tier latency. The perf worker keeps no object bytes: data-store writes are
  # discarded and reads return zeros, so these sleeps (microseconds per call) are the only
  # cost of objects larger than max_kv_store. 0 = no delay.
  sim_disk_write_us: 0
  sim_disk_read_us: 0

# ---- common settings ------------------------------------------------------------------
base:
  # data set
  num_objects: 1_000_000_000 # total objects loaded
  num_buckets: 10            # bucket names are <bucket_name_prefix>-<i>
  bucket_name_prefix: rgwkv
  padding_bytes: 200         # random key-prefix length (key = prefix + 20-digit id)
  object_size_bytes: 8192    # payload size
  metadata_count: 6          # user-metadata (x-amz-meta-*) items attached to every put (0 = none, max 160)
  metadata_size: 64          # bytes per metadata value (1..2048); keys are meta000, meta001, ...
  tenant_name: kv-poc
  # parallelism
  worker_count: 32           # worker processes (local mode), one runtime each
  threads_per_worker: 128    # sync mode: one thread per stream; the default for streams_per_worker
  # Client model. sync: one blocking thread per stream calling the sync API (today's model).
  # async: the streams are coroutines on driver_threads executors calling the async API, so
  # concurrency is not bounded by threads. Compare them on one build with the same streams.
  driver_mode: sync
  streams_per_worker: 0      # closed-loop concurrency per worker; 0 = threads_per_worker
  driver_threads: 2          # async mode: executor threads driving the streams
  # Open loop (async mode, run-put-object / -overwrite(-versioned) / run-delete-multi): issue
  # ops at this fixed per-worker rate whether or not earlier ones finished, and measure latency
  # from each op's scheduled time. 0 = closed loop.
  rate_ops_per_sec: 0
  arrival: constant          # open-loop inter-arrival times: constant or poisson
  # Open-loop ramp (--ramp; run-put-object / -overwrite / -overwrite-versioned): offer
  # ramp_start_rate, then + ramp_step_rate per step (cluster totals, ops/s), each step a
  # warm-up then a measured window, until a step fails a criterion. Reports the maximum
  # sustainable rate. See perf/RAMP.md. ops is not allowed; duration is ignored.
  ramp: false
  ramp_mode: sla             # sla: judge latency, misses, errors, backlog, throughput;
                             # throughput: only achieved (and errors), latency ignored
  ramp_start_rate: 0         # required with --ramp
  ramp_step_rate: 0          # 0 = ramp_start_rate
  ramp_max_rate: 0           # 0 = no ceiling
  ramp_warmup: 30s
  ramp_measure: 60s
  ramp_max_p99_ms: 50        # end-to-end p99 (from scheduled send time) must be below this
  ramp_max_missed_pct: 0.1   # missed / scheduled arrivals
  ramp_max_error_pct: 0.1
  ramp_min_achieved_pct: 0   # completed / target; 0 = 99 (sla) or 98 (throughput)
  ramp_max_backlog_growth_pct: 50  # ops in flight at the end of the window vs expected
  verify_threads: 16         # scan threads per worker during Verify
  # reporting and collectors
  report_interval_ms: 10000  # progress-window length (0 = one report for the whole run)
  fdb_stats: true            # sample `fdbcli status json` (--no-fdb-stats to disable)
  # Also keep every raw sample, compacted, in fdb_status.jsonl: one JSON object per line,
  # {"ts_ms","phase","took_ms","status":{...}} (or "error" instead of "status" when the call
  # failed). phase is init, benchmark, post (between benchmark end and verify) or verify.
  # About 330KB per sample uncompressed (~0.45GiB per 12h at 30s). Needs fdb_stats.
  fdb_status_raw: true
  fdb_cluster_file: ""       # "" => $FDB_CLUSTER_FILE
  fdbcli_path: /opt/foundationdb/usr/bin/fdbcli   # falls back to PATH, next to the binary, /opt/kvrgw
  # `fdbcli status json` can take many seconds on a loaded cluster. The call gets --timeout
  # fdb_status_timeout_ms (rounded up to whole seconds) and the process is killed 2s later. Sampling
  # is sequential, so fdb_sample_interval_ms must be >= that outer limit (checked at start-up).
  # report --window must be >= the sample interval for the per-window FDB tables to show.
  fdb_sample_interval_ms: 30000
  fdb_status_timeout_ms: 20000
  cpu_sample_interval_ms: 5000

# ---- per-command sections (each lists what is tunable for that command) ---------------
# Fixed op count; no ops/duration. Creates the buckets (left UNVERSIONED) and loads
# num_objects objects. Fails if a bucket already exists, unless `force` (--force) is set:
# then existing buckets and objects are kept and load puts its keys into them.
load:
  force: false

# For the run-* commands exactly one of `ops` (total across the cluster) / `duration`
# must be set. The files below use `duration`; `--ops N` on the CLI replaces it, and
# `ops: 0` means unset.

# Inserts brand-new keys (never present from load or earlier runs).
run-put-object:
  duration: 12h

# Pages through listings; buckets are split across workers (bucket b => worker b % workers).
run-list-objects:
  worker_count: 10           # purposely equal to num_buckets so each worker gets a bucket.
  threads_per_worker: 16
  duration: 20m
  page_size: 1000            # keys per list call
  single_thread_mode: false  # true: one worker, one thread, bucket 0 only

# Repeatedly overwrites every loaded key (each thread loops over its whole slice of the keys).
# Needs never-versioned buckets, as `load` creates them, so every put replaces the object in
# place. Init fails if versioning is enabled or suspended; a run aborts if a put creates a
# version; verify fails if any key has version history (a non-null version or a delete marker).
run-put-object-overwrite:
  duration: 12h

# Overwrites a limited set of keys and verifies the number of versions written per key.
# Asks for confirmation (--yes skips it) and then ENABLES versioning on the buckets, which cannot
# be switched back off; old versions are not reclaimed, and run-put-object-overwrite can no longer
# be used on these buckets (use a new bucket_name_prefix and load). num_objects_to_overwrite is the TOTAL number of keys overwritten,
# shared evenly across all workers * threads (e.g. 1000000 over 8 x 32 threads = ~3906 keys per
# thread); it must be <= num_objects. The limit matters for two reasons: the version-count check
# only means something if each key is overwritten repeatedly, so keep the set small enough that
# the run loops over it several times (a set much larger than the number of puts leaves most keys
# with 0 or 1 versions and checks little); and verification does one list_object_versions call
# per overwritten key, so the size of the set bounds how long verification takes.
run-put-object-overwrite-versioned:
  duration: 12h
  num_objects_to_overwrite: 1_000_000

# DESTRUCTIVE: like run-list-objects each worker owns bucket b % workers, and the bucket's
# two-character key prefixes (70 x 70) are striped across the worker's threads. Each thread
# pages through its prefixes with a continuation token: list page_size keys, delete_multi
# exactly those keys, repeat. Records list, delete_multi and combined list_delete_multi
# latencies. Needs padding_bytes >= 2. A thread stops when its prefixes are drained.
run-list-delete-multi:
  worker_count: 10           # purposely equal to num_buckets so each worker gets a bucket.
  threads_per_worker: 16
  duration: 12h              # will exit long before this hopefully
  page_size: 1000            # keys per list call (and per delete_multi call)
  single_thread_mode: false  # true: one worker, one thread, bucket 0 only

# DESTRUCTIVE: deletes loaded objects in batches (prompts unless --yes).
run-delete-multi:
  threads_per_worker: 16
  duration: 12h              # will exit long before this hopefully
  page_size: 1000            # max keys per delete_multi call
  single_thread_mode: false  # true: one worker, one thread, bucket 0 only
